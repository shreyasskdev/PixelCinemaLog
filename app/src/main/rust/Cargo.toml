[package]
name = "pixel_log_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ash = { version = "0.38", default-features = false, features = ["linked", "debug"] }
ndk = { version = "0.9", features = ["media", "nativewindow", "api-level-33"] }
ndk-sys = "0.6"
jni = "0.21"
bytemuck = { version = "1.18", features = ["derive"] }
log = "0.4"
android_logger = "0.14"